<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Charcuteria Revueltas</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    .app-fallback {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #171717;
      background: linear-gradient(180deg, #fff7f7 0%, #ffffff 42%, #f5f5f5 100%);
    }

    .app-fallback__panel {
      width: min(720px, 100%);
      padding: 28px;
      border: 1px solid rgba(190, 18, 60, 0.16);
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 18px 48px rgba(23, 23, 23, 0.08);
    }

    .app-fallback__label {
      margin: 0 0 12px;
      color: #be123c;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .app-fallback h1 {
      margin: 0;
      font-size: clamp(2.4rem, 10vw, 4rem);
      line-height: 1;
    }

    .app-fallback p {
      margin: 18px 0 0;
      color: #626262;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <app-root>
    <main class="app-fallback">
      <section class="app-fallback__panel" aria-labelledby="fallback-title">
        <p class="app-fallback__label">Charcuteria artesana</p>
        <h1 id="fallback-title">Charcuteria Revueltas</h1>
        <p>Si ves este mensaje de forma permanente, el navegador no ha podido cargar los archivos de la aplicacion.</p>
      </section>
    </main>
  </app-root>
</body>
</html>
